name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools
        run: aftman install

      - name: Build plugin
        run: |
          lune run tests/run.luau
          lune run tests/import_pipeline.luau
          lune run tests/assets.luau
          lune run tests/appearance.luau
          lune run tests/architecture.luau
          stylua --check src tests
          selene src
          selene --config tests/selene.toml tests
          rojo build default.project.json --output UIImporterPro.rbxm
          lune run tests/verify_build.luau UIImporterPro.rbxm

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: UIImporterPro.rbxm
          generate_release_notes: true
